<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semáforo v4.0 - Dashboard Completo</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-sync, .btn-tab {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-sync {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-sync:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-tab {
            background: #f0f0f0;
            color: #333;
        }

        .btn-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* KANBAN */
        .kanban-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kanban-column {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            min-height: 500px;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .column-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .column-count {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
            border-color: #667eea;
        }

        .card-checkbox {
            margin-right: 10px;
            cursor: pointer;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card-title {
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 500;
        }

        .badge-comunidad {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-proveedor {
            background: #e9d5ff;
            color: #6b21a8;
        }

        .badge-estado {
            background: #fed7aa;
            color: #92400e;
        }

        .card-footer {
            font-size: 12px;
            color: #999;
        }

        /* CALENDAR SECTION */
        .section-title {
            font-size: 22px;
            font-weight: 700;
            color: white;
            margin-top: 40px;
            margin-bottom: 20px;
            padding-left: 10px;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .event-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .event-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .event-time {
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .event-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .event-location {
            font-size: 13px;
            color: #666;
        }

        /* EMAIL SECTION */
        .emails-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .email-card {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid #764ba2;
        }

        .email-card:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(4px);
        }

        .email-from {
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .email-subject {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .email-snippet {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .email-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #999;
        }

        .email-labels {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .email-label {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }

        /* TASKS SECTION */
        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-card {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid #10b981;
            display: flex;
            gap: 12px;
        }

        .task-card:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(4px);
        }

        .task-checkbox {
            margin-top: 2px;
            cursor: pointer;
            width: 20px;
            height: 20px;
        }

        .task-content {
            flex: 1;
        }

        .task-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .task-date {
            font-size: 12px;
            color: #10b981;
            font-weight: 500;
        }

        .task-notes {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        /* LOADING */
        .loading {
            text-align: center;
            padding: 20px;
            color: white;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .header h1 {
                width: 100%;
            }

            .kanban-grid {
                grid-template-columns: 1fr;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>📊 Semáforo v4.0</h1>
            <div class="header-buttons">
                <button class="btn-sync" id="syncBtn" onclick="sincronizar()">🔄 Sincronizar</button>
            </div>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="btn-tab active" onclick="cambiarTab('kanban')">Kanban</button>
            <button class="btn-tab" onclick="cambiarTab('calendar')">📅 Agenda</button>
            <button class="btn-tab" onclick="cambiarTab('emails')">📧 Correos</button>
            <button class="btn-tab" onclick="cambiarTab('tasks')">✓ Tareas</button>
        </div>

        <!-- TAB: KANBAN -->
        <div id="kanban" class="tab-content active">
            <div class="kanban-grid" id="kanbanGrid">
                <div class="kanban-column">
                    <div class="column-header">
                        <span class="column-title">📋 Incidencias</span>
                        <span class="column-count" id="count-incidencias">0</span>
                    </div>
                    <div class="cards-container" id="column-incidencias"></div>
                </div>

                <div class="kanban-column">
                    <div class="column-header">
                        <span class="column-title">📝 Borradores</span>
                        <span class="column-count" id="count-borradores">0</span>
                    </div>
                    <div class="cards-container" id="column-borradores"></div>
                </div>

                <div class="kanban-column">
                    <div class="column-header">
                        <span class="column-title">❓ Dudas</span>
                        <span class="column-count" id="count-dudas">0</span>
                    </div>
                    <div class="cards-container" id="column-dudas"></div>
                </div>

                <div class="kanban-column">
                    <div class="column-header">
                        <span class="column-title">✅ Completadas</span>
                        <span class="column-count" id="count-completadas">0</span>
                    </div>
                    <div class="cards-container" id="column-completadas"></div>
                </div>
            </div>
        </div>

        <!-- TAB: CALENDAR -->
        <div id="calendar" class="tab-content">
            <h2 class="section-title">📅 Agenda del día</h2>
            <div class="events-grid" id="eventsGrid">
                <div class="empty-state">
                    <div class="empty-state-icon">📅</div>
                    <p>No hay eventos hoy</p>
                </div>
            </div>
        </div>

        <!-- TAB: EMAILS -->
        <div id="emails" class="tab-content">
            <h2 class="section-title">📧 Correos recientes</h2>
            <div class="emails-list" id="emailsList">
                <div class="empty-state">
                    <div class="empty-state-icon">📧</div>
                    <p>No hay correos</p>
                </div>
            </div>
        </div>

        <!-- TAB: TASKS -->
        <div id="tasks" class="tab-content">
            <h2 class="section-title">✓ Tareas pendientes</h2>
            <div class="tasks-list" id="tasksList">
                <div class="empty-state">
                    <div class="empty-state-icon">✓</div>
                    <p>No hay tareas pendientes</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURACIÓN FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDyVGUFxn0V3t3V3t3V3t3V3t3V3t3V3t3",
            authDomain: "semaforo-fincas-5daea.firebaseapp.com",
            projectId: "semaforo-fincas-5daea",
            storageBucket: "semaforo-fincas-5daea.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================
        // DATOS DE PRUEBA (Google Calendar, Gmail, Tasks)
        // ============================================================
        const mockCalendarData = [
            {
                title: "Reunión comunidad Soto 4",
                start: new Date().toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'}),
                end: "11:00",
                location: "Soto 4"
            },
            {
                title: "Llamada con Fontanería López",
                start: "14:30",
                end: "15:00",
                location: "Teléfono"
            }
        ];

        const mockEmailData = [
            {
                subject: "Reparación tubería - URGENTE",
                from: "info@fontaneria.com",
                date: "Hoy 09:30",
                snippet: "Se ha detectado una fuga en la tubería principal de la zona común...",
                labels: ["COMUNIDADES/Soto 4"]
            },
            {
                subject: "Presupuesto ascensor revisión anual",
                from: "contacto@ascensores.com",
                date: "Hoy 08:15",
                snippet: "Adjuntamos presupuesto para la revisión anual del ascensor...",
                labels: ["COMUNIDADES/Breogán"]
            },
            {
                subject: "Inspección eléctrica completada",
                from: "empresa@electricidad.com",
                date: "Ayer 17:45",
                snippet: "Se ha realizado la inspección eléctrica anual. Todo conforme...",
                labels: ["COMUNIDADES/Urbanización Breogán"]
            }
        ];

        const mockTasksData = [
            {
                title: "Seguimiento reparación tubería Soto 4",
                due: new Date().toLocaleDateString('es-ES'),
                notes: "Verificar que la reparación se ha completado"
            },
            {
                title: "Contactar con proveedor ascensor",
                due: new Date(Date.now() + 2 * 24 * 60 * 60 * 1000).toLocaleDateString('es-ES'),
                notes: "Confirmar fecha de revisión"
            },
            {
                title: "Revisar presupuestos pendientes",
                due: new Date(Date.now() + 5 * 24 * 60 * 60 * 1000).toLocaleDateString('es-ES'),
                notes: "Comparar precios de 3 proveedores"
            }
        ];

        // ============================================================
        // FUNCIONES PRINCIPALES
        // ============================================================
        function cambiarTab(tabName) {
            // Ocultar todos los tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.btn-tab').forEach(btn => {
                btn.classList.remove('active');
            });

            // Mostrar el tab seleccionado
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        async function sincronizar() {
            const btn = document.getElementById('syncBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> Sincronizando...';

            try {
                // Cargar datos de Firestore
                await cargarGestiones();

                // Cargar datos de Google (actualmente datos de prueba)
                mostrarCalendario();
                mostrarCorreos();
                mostrarTareas();

                btn.innerHTML = '✅ Sincronizado';
                setTimeout(() => {
                    btn.innerHTML = '🔄 Sincronizar';
                    btn.disabled = false;
                }, 2000);
            } catch (error) {
                console.error('Error sincronizando:', error);
                btn.innerHTML = '❌ Error';
                setTimeout(() => {
                    btn.innerHTML = '🔄 Sincronizar';
                    btn.disabled = false;
                }, 2000);
            }
        }

        async function cargarGestiones() {
            const tipos = ['incidencias', 'borradores', 'dudas'];
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            const mañana = new Date(hoy);
            mañana.setDate(mañana.getDate() + 1);

            for (const tipo of tipos) {
                const q = firebase.firestore.query(
                    db.collection(tipo),
                    firebase.firestore.where('fechaVencimiento', '<', firebase.firestore.Timestamp.fromDate(mañana)),
                    firebase.firestore.where('completada', '==', false)
                );

                const snapshot = await q.get();
                const gestiones = [];

                snapshot.forEach(doc => {
                    gestiones.push({id: doc.id, ...doc.data()});
                });

                mostrarGestiones(tipo, gestiones);
            }

            // Cargar completadas
            const qCompletadas = firebase.firestore.query(
                db.collection('incidencias'),
                firebase.firestore.where('completada', '==', true)
            );
            const snapshotCompletadas = await qCompletadas.get();
            const completadas = [];
            snapshotCompletadas.forEach(doc => {
                completadas.push({id: doc.id, ...doc.data()});
            });
            mostrarGestiones('completadas', completadas);
        }

        function mostrarGestiones(tipo, gestiones) {
            const column = document.getElementById(`column-${tipo}`);
            const count = document.getElementById(`count-${tipo}`);

            column.innerHTML = '';
            count.textContent = gestiones.length;

            if (gestiones.length === 0) {
                column.innerHTML = '<div class="empty-state"><p>Vacío</p></div>';
                return;
            }

            gestiones.forEach(g => {
                const card = document.createElement('div');
                card.className = 'card';

                const fecha = g.fechaVencimiento ?
                    new Date(g.fechaVencimiento.seconds * 1000).toLocaleDateString('es-ES') :
                    'Sin fecha';

                card.innerHTML = `
                    <div class="card-header">
                        <input type="checkbox" class="card-checkbox" ${g.completada ? 'checked' : ''}
                            onchange="marcarCompletada('${tipo}', '${g.id}', this.checked)">
                        <div class="card-title">${g.asunto}</div>
                    </div>
                    <div class="card-badges">
                        <span class="badge badge-comunidad">${g.comunidad}</span>
                        <span class="badge badge-proveedor">${g.proveedor}</span>
                        <span class="badge badge-estado">${g.estado}</span>
                    </div>
                    <div class="card-footer">📅 ${fecha}</div>
                `;

                column.appendChild(card);
            });
        }

        async function marcarCompletada(tipo, docId, completada) {
            try {
                await db.collection(tipo).doc(docId).update({
                    completada: completada
                });
                await cargarGestiones();
            } catch (error) {
                console.error('Error marcando completada:', error);
            }
        }

        function mostrarCalendario() {
            const grid = document.getElementById('eventsGrid');
            grid.innerHTML = '';

            if (mockCalendarData.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📅</div><p>No hay eventos hoy</p></div>';
                return;
            }

            mockCalendarData.forEach(event => {
                const eventCard = document.createElement('div');
                eventCard.className = 'event-card';
                eventCard.innerHTML = `
                    <div class="event-time">⏰ ${event.start} - ${event.end}</div>
                    <div class="event-title">${event.title}</div>
                    <div class="event-location">📍 ${event.location}</div>
                `;
                eventCard.onclick = () => window.open('https://calendar.google.com', '_blank');
                grid.appendChild(eventCard);
            });
        }

        function mostrarCorreos() {
            const list = document.getElementById('emailsList');
            list.innerHTML = '';

            if (mockEmailData.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📧</div><p>No hay correos</p></div>';
                return;
            }

            mockEmailData.forEach(email => {
                const emailCard = document.createElement('div');
                emailCard.className = 'email-card';
                emailCard.innerHTML = `
                    <div class="email-from">${email.from}</div>
                    <div class="email-subject">${email.subject}</div>
                    <div class="email-snippet">${email.snippet}</div>
                    <div class="email-meta">
                        <span>${email.date}</span>
                        <div class="email-labels">
                            ${email.labels.map(l => `<span class="email-label">${l}</span>`).join('')}
                        </div>
                    </div>
                `;
                emailCard.onclick = () => window.open('https://gmail.com', '_blank');
                list.appendChild(emailCard);
            });
        }

        function mostrarTareas() {
            const list = document.getElementById('tasksList');
            list.innerHTML = '';

            if (mockTasksData.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✓</div><p>No hay tareas</p></div>';
                return;
            }

            mockTasksData.forEach((task, idx) => {
                const taskCard = document.createElement('div');
                taskCard.className = 'task-card';
                taskCard.innerHTML = `
                    <input type="checkbox" class="task-checkbox" onchange="completarTarea(this)">
                    <div class="task-content">
                        <div class="task-title">${task.title}</div>
                        <div class="task-date">📅 Vencimiento: ${task.due}</div>
                        ${task.notes ? `<div class="task-notes">${task.notes}</div>` : ''}
                    </div>
                `;
                taskCard.onclick = (e) => {
                    if (e.target.type !== 'checkbox') {
                        window.open('https://tasks.google.com', '_blank');
                    }
                };
                list.appendChild(taskCard);
            });
        }

        function completarTarea(checkbox) {
            checkbox.parentElement.style.opacity = '0.5';
        }

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        window.addEventListener('load', () => {
            cargarGestiones();
            mostrarCalendario();
            mostrarCorreos();
            mostrarTareas();

            // Auto-sincronizar cada 30 segundos
            setInterval(() => {
                cargarGestiones();
            }, 30000);
        });
    </script>
</body>
</html>
