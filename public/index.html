<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semáforo v4.0 - Eduardo Máiz</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            background: white;
            padding: 25px 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header-left-section {
            flex: 0 0 auto;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 12px;
            min-width: 80px;
        }

        .header-center-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .header-right-section {
            flex: 0 0 auto;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            min-width: 140px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            object-fit: contain;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-name {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            line-height: 1.2;
        }

        .user-title {
            font-size: 12px;
            color: #666;
            font-weight: 500;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .btn-sync {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            white-space: nowrap;
        }

        .btn-sync:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-sync:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* KANBAN GRID - 4 COLUMNS LAYOUT */
        .kanban-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            auto-rows: max-content;
        }

        /* Row 1 items */
        .kanban-column {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        /* Row 2 items - smaller height */
        .kanban-column.row-2 {
            min-height: 450px;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .column-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }

        .column-count {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* SCROLLBAR */
        .cards-container::-webkit-scrollbar {
            width: 6px;
        }

        .cards-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .cards-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .cards-container::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        /* TARJETAS KANBAN */
        .card {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            gap: 10px;
        }

        .card:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
            border-color: #667eea;
        }

        .card-checkbox {
            margin-top: 2px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .card-content {
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-weight: 600;
            color: #333;
            font-size: 14px;
            margin-bottom: 8px;
            line-height: 1.3;
            word-wrap: break-word;
        }

        .card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 8px;
        }

        .badge {
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: 500;
            white-space: nowrap;
        }

        .badge-comunidad {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-proveedor {
            background: #e9d5ff;
            color: #6b21a8;
        }

        .badge-estado {
            background: #fed7aa;
            color: #92400e;
        }

        .badge-email {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-task {
            background: #fce7f3;
            color: #831843;
        }

        .card-footer {
            font-size: 11px;
            color: #999;
        }

        .card-from {
            font-size: 11px;
            color: #667eea;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .card-snippet {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .card-date {
            font-size: 11px;
            color: #10b981;
            font-weight: 500;
        }

        /* BOTÓN PREPARAR BORRADOR */
        .btn-prepare {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            width: 100%;
        }

        .btn-prepare:hover {
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
            transform: translateY(-1px);
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: #999;
            font-size: 13px;
        }

        .empty-state-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        /* RESPONSIVE */
        @media (max-width: 1200px) {
            .kanban-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .kanban-container {
                grid-template-columns: 1fr;
            }

            .kanban-column {
                min-height: 400px;
            }

            .kanban-column.row-2 {
                min-height: 400px;
            }

            .header {
                flex-direction: column;
                text-align: center;
            }

            .header-left {
                width: 100%;
                justify-content: center;
            }

            .btn-sync {
                width: 100%;
            }
        }
    </style>
</head>

    <script>
        // ============================================================
        // CONFIGURACIÓN FIREBASE (PRODUCCIÓN)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDWGtp5r77zWwc6Hiq4JJR4XhPwkSkOchA",
            authDomain: "semaforo-fincas-5daea.firebaseapp.com",
            projectId: "semaforo-fincas-5daea",
            storageBucket: "semaforo-fincas-5daea.firebasestorage.app",
            messagingSenderId: "808198369573",
            appId: "1:808198369573:web:3f19f13ff2e32f2ea6acc",
            measurementId: "G-YCN158F43W"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================
        // CONFIGURACIÓN GOOGLE APPS SCRIPT
        // ============================================================
        // URL de despliegue de Google Apps Script (Producción)
        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUC4VCru6W93Fs1snxXSg8Wwx-PoYLqMCudE4QBh2levJe_Rku3uc6MEmz96qsbaEp1w/exec";

        // Variables globales para almacenar datos en caché
        let calendarData = [];
        let emailData = [];
        let tasksData = [];

        // ============================================================
        // FUNCIONES PRINCIPALES
        // ============================================================
        async function sincronizar() {
            const btn = document.getElementById('syncBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ Sincronizando...';

            try {
                // Cargar datos de Firestore
                await cargarGestiones();

                // Cargar datos de Google Workspace en paralelo
                await Promise.all([
                    cargarCalendario(),
                    cargarCorreos(),
                    cargarTareas()
                ]);

                btn.innerHTML = '✅ Sincronizado';
                setTimeout(() => {
                    btn.innerHTML = '🔄 Sincronizar';
                    btn.disabled = false;
                }, 2000);
            } catch (error) {
                console.error('Error sincronizando:', error);
                btn.innerHTML = '❌ Error';
                setTimeout(() => {
                    btn.innerHTML = '🔄 Sincronizar';
                    btn.disabled = false;
                }, 2000);
            }
        }

        async function cargarGestiones() {
            const tipos = ['incidencias', 'borradores', 'dudas'];
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            const mañana = new Date(hoy);
            mañana.setDate(mañana.getDate() + 1);

            for (const tipo of tipos) {
                try {
                    const snapshot = await db.collection(tipo)
                        .where('fechaVencimiento', '<', firebase.firestore.Timestamp.fromDate(mañana))
                        .where('completada', '==', false)
                        .get();

                    const gestiones = [];
                    snapshot.forEach(doc => {
                        gestiones.push({id: doc.id, tipo: tipo, ...doc.data()});
                    });

                    mostrarGestiones(tipo, gestiones);
                } catch (e) {
                    console.error(`Error cargando ${tipo}:`, e);
                    mostrarGestiones(tipo, []);
                }
            }

            // Cargar completadas
            try {
                const snapshotCompletadas = await db.collection('incidencias')
                    .where('completada', '==', true)
                    .get();

                const completadas = [];
                snapshotCompletadas.forEach(doc => {
                    completadas.push({id: doc.id, tipo: 'incidencias', ...doc.data()});
                });
                mostrarGestiones('completadas', completadas);
            } catch (e) {
                console.error('Error cargando completadas:', e);
                mostrarGestiones('completadas', []);
            }
        }

        function mostrarGestiones(tipo, gestiones) {
            const column = document.getElementById(`column-${tipo}`);
            const count = document.getElementById(`count-${tipo}`);

            column.innerHTML = '';
            count.textContent = gestiones.length;

            if (gestiones.length === 0) {
                column.innerHTML = '<div class="empty-state"><div class="empty-state-icon">—</div><p>Vacío</p></div>';
                return;
            }

            gestiones.forEach(g => {
                const card = document.createElement('div');
                card.className = 'card';

                const fecha = g.fechaVencimiento ?
                    new Date(g.fechaVencimiento.seconds * 1000).toLocaleDateString('es-ES') :
                    'Sin fecha';

                const badgesHTML = `
                    <span class="badge badge-comunidad">${g.comunidad}</span>
                    <span class="badge badge-proveedor">${g.proveedor}</span>
                    <span class="badge badge-estado">${g.estado}</span>
                `;

                card.innerHTML = `
                    <input type="checkbox" class="card-checkbox" ${g.completada ? 'checked' : ''}
                        onchange="marcarCompletada('${g.tipo}', '${g.id}', this.checked)">
                    <div class="card-content">
                        <div class="card-title">${g.asunto}</div>
                        <div class="card-badges">${badgesHTML}</div>
                        <div class="card-footer">📅 ${fecha}</div>
                    </div>
                `;

                column.appendChild(card);
            });
        }

        async function marcarCompletada(tipo, docId, completada) {
            try {
                await db.collection(tipo).doc(docId).update({
                    completada: completada
                });
                await cargarGestiones();
            } catch (error) {
                console.error('Error marcando completada:', error);
            }
        }

        async function cargarCalendario() {
            try {
                const url = `${CORS_PROXY}${encodeURIComponent(GOOGLE_APPS_SCRIPT_URL + '?action=calendar')}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.success && data.events) {
                    calendarData = data.events;
                } else {
                    calendarData = [];
                }
            } catch (error) {
                console.error('Error cargando calendario:', error);
                calendarData = [];
            }
            mostrarCalendario();
        }

        function mostrarCalendario() {
            const column = document.getElementById('column-calendar');
            const count = document.getElementById('count-calendar');

            column.innerHTML = '';
            count.textContent = calendarData.length;

            if (calendarData.length === 0) {
                column.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📅</div><p>Sin eventos</p></div>';
                return;
            }

            calendarData.forEach(event => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.flexDirection = 'column';
                card.style.gap = '8px';
                card.onclick = () => window.open('https://calendar.google.com', '_blank');

                card.innerHTML = `
                    <div class="card-title">⏰ ${event.start} - ${event.end}</div>
                    <div class="card-title">${event.title}</div>
                    <div class="badge badge-email">${event.location || 'Sin ubicación'}</div>
                `;

                column.appendChild(card);
            });
        }

        async function cargarCorreos() {
            try {
                const url = `${CORS_PROXY}${encodeURIComponent(GOOGLE_APPS_SCRIPT_URL + '?action=emails')}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.success && data.emails) {
                    emailData = data.emails;
                } else {
                    emailData = [];
                }
            } catch (error) {
                console.error('Error cargando correos:', error);
                emailData = [];
            }
            mostrarCorreos();
        }

        function mostrarCorreos() {
            const column = document.getElementById('column-emails');
            const count = document.getElementById('count-emails');

            column.innerHTML = '';
            count.textContent = emailData.length;

            if (emailData.length === 0) {
                column.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📧</div><p>Sin correos</p></div>';
                return;
            }

            emailData.forEach(email => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.flexDirection = 'column';
                card.style.gap = '6px';

                card.innerHTML = `
                    <div class="card-from">${email.from}</div>
                    <div class="card-title">${email.subject}</div>
                    <div class="card-snippet">${email.snippet || 'Sin vista previa'}</div>
                    <div class="card-footer">📅 ${email.date}</div>
                    <button class="btn-prepare" onclick="prepararBorrador(${JSON.stringify(email).replace(/"/g, '&quot;')})">
                        ➜ Preparar Borrador
                    </button>
                `;

                column.appendChild(card);
            });
        }

        async function prepararBorrador(email) {
            try {
                const nuevoborrador = {
                    asunto: email.subject || 'Sin asunto',
                    descripcion: `De: ${email.from}\n\nSujeto: ${email.subject}\n\n${email.snippet || '(Sin contenido)'}`,
                    comunidad: 'Emails',
                    proveedor: email.from || 'Desconocido',
                    estado: 'Pendiente',
                    fechaVencimiento: firebase.firestore.Timestamp.fromDate(new Date()),
                    completada: false,
                    tipo: 'borradores',
                    fechaCreacion: firebase.firestore.Timestamp.now(),
                    origen: 'email',
                    threadId: email.threadId || null
                };

                const docRef = await db.collection('borradores').add(nuevoborrador);
                console.log('Borrador creado:', docRef.id);

                // Recargar vistas
                await cargarGestiones();
                await cargarCorreos();

                // Mostrar confirmación
                alert(`✅ Borrador creado a partir de: "${email.subject}"`);

            } catch (error) {
                console.error('Error creando borrador:', error);
                alert('❌ Error al crear el borrador: ' + error.message);
            }
        }

        async function cargarTareas() {
            try {
                const url = `${CORS_PROXY}${encodeURIComponent(GOOGLE_APPS_SCRIPT_URL + '?action=tasks')}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.success && data.tasks) {
                    tasksData = data.tasks;
                } else {
                    tasksData = [];
                }
            } catch (error) {
                console.error('Error cargando tareas:', error);
                tasksData = [];
            }
            mostrarTareas();
        }

        function mostrarTareas() {
            const column = document.getElementById('column-tasks');
            const count = document.getElementById('count-tasks');

            column.innerHTML = '';
            count.textContent = tasksData.length;

            if (tasksData.length === 0) {
                column.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✓</div><p>Sin tareas</p></div>';
                return;
            }

            tasksData.forEach(task => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.flexDirection = 'column';
                card.style.gap = '6px';
                card.onclick = () => window.open('https://tasks.google.com', '_blank');

                card.innerHTML = `
                    <div class="card-title">${task.title}</div>
                    <div class="card-footer">📅 ${task.due}</div>
                    <div class="badge badge-task">${task.notes || 'Sin notas'}</div>
                `;

                column.appendChild(card);
            });
        }

        // Auto-sincronizar al cargar
        window.addEventListener('load', () => {
            sincronizar();
            // Sincronizar cada 30 segundos
            setInterval(sincronizar, 30000);
        });
    </script>
</body>
</html>
