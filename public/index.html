<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semáforo de Incidencias</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .header h1 { font-size: 28px; color: #667eea; }
        .sync-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .sync-button:hover { transform: translateY(-2px); }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2); }
        .card h2 { color: #667eea; margin-bottom: 15px; font-size: 18px; }
        .items-list { margin-top: 15px; max-height: 300px; overflow-y: auto; }
        .item {
            background: #f8f9fa;
            border: 1px solid #e0e0e0;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .item:hover { background: #e8eaf6; border-color: #667eea; transform: translateX(5px); }
        .item-title { font-weight: 600; color: #333; margin-bottom: 4px; }
        .item-desc { font-size: 12px; color: #999; }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
            background: #d4edda;
            color: #155724;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }
        .modal-header h2 { color: #667eea; margin: 0; }
        .close-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: #999; }
        .modal-field { margin-bottom: 12px; }
        .modal-label { font-weight: 600; color: #667eea; margin-bottom: 4px; display: block; }
        .modal-value { color: #333; padding: 8px; background: #f8f9fa; border-radius: 4px; }
        .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .action-btn {
            flex: 1;
            min-width: 120px;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .action-btn-complete { background: #28a745; color: white; }
        .action-btn-complete:hover { background: #218838; }
        .action-btn-cancel { background: #dc3545; color: white; }
        .action-btn-cancel:hover { background: #c82333; }
        .footer { text-align: center; color: white; font-size: 12px; margin-top: 30px; }
        .empty-state { text-align: center; padding: 20px; color: #999; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Semáforo de Incidencias v2.0</h1>
            <button class="sync-button" onclick="syncData()">✓ Sincronizar</button>
        </div>

        <div class="cards-grid">
            <div class="card">
                <h2>📋 Incidencias</h2>
                <div id="incidencias-list" class="items-list">
                    <div class="empty-state">Cargando...</div>
                </div>
                <span class="status-badge" id="incidencias-status">Cargando...</span>
            </div>

            <div class="card">
                <h2>📧 Borradores</h2>
                <div id="borradores-list" class="items-list">
                    <div class="empty-state">Cargando...</div>
                </div>
                <span class="status-badge" id="borradores-status">✓ Disponible</span>
            </div>

            <div class="card">
                <h2>❓ Dudas</h2>
                <div id="dudas-list" class="items-list">
                    <div class="empty-state">Cargando...</div>
                </div>
                <span class="status-badge" id="dudas-status">✓ Disponible</span>
            </div>

            <div class="card">
                <h2>✅ Completadas</h2>
                <div id="completadas-list" class="items-list">
                    <div class="empty-state">Sin completadas</div>
                </div>
                <span class="status-badge" id="completadas-count">0</span>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Detalles</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

    <div class="footer">
        <p>Semáforo de Incidencias | v2.0 | 2026-10-09</p>
    </div>

    <script>
        console.log('✓ Dashboard v2.0 iniciado');

        const state = {
            incidencias: [],
            borradores: [],
            dudas: [],
            completadas: []
        };

        function loadData() {
            console.log('✓ Cargando datos...');

            // Cargar incidencias
            fetch('/api/proxy')
                .then(r => r.json())
                .then(data => {
                    if (data && data.incidencias) {
                        state.incidencias = data.incidencias.slice(0, 5).map((inc, i) => ({
                            id: i,
                            titulo: inc.asunto || inc.tipo || 'Sin título',
                            desc: (inc.comunidad || '') + ' - ' + (inc.propiedad || ''),
                            estado: inc.estado || 'Pendiente',
                            proveedor: inc.proveedor || 'N/A',
                            oficio: inc.oficio || 'General',
                            fecha: inc.fechaAlta || '---'
                        }));
                    }
                    updateUI();
                })
                .catch(e => {
                    console.log('Cloud Run no disponible, usando ejemplos');
                    state.incidencias = [
                        { id: 1, titulo: 'Reparación tejado', desc: 'Bloque A', estado: 'Pendiente', proveedor: 'Juan', oficio: 'Obra', fecha: '2026-10-08' },
                        { id: 2, titulo: 'Fontanería', desc: 'Bloque B', estado: 'En progreso', proveedor: 'Carlos', oficio: 'Fontanería', fecha: '2026-10-07' }
                    ];
                    updateUI();
                });

            // Borradores de ejemplo
            state.borradores = [
                { id: 1, titulo: 'Respuesta reparación', asunto: 'Solicitud pendiente', fecha: '2026-10-09' },
                { id: 2, titulo: 'Presupuesto reformas', asunto: 'Cotización', fecha: '2026-10-09' }
            ];

            // Dudas
            state.dudas = [
                { id: 1, titulo: '¿Estado incidencia #45?', desc: 'Revisar Fynkus', fecha: new Date().toLocaleDateString() },
                { id: 2, titulo: '¿Confirmó el proveedor?', desc: 'Pendiente confirmación', fecha: new Date().toLocaleDateString() }
            ];

            // Cargar completadas
            const saved = localStorage.getItem('semaforo_completadas');
            if (saved) state.completadas = JSON.parse(saved);

            updateUI();
        }

        function updateUI() {
            console.log('✓ Actualizando UI');

            // Incidencias
            const inc_list = document.getElementById('incidencias-list');
            if (state.incidencias.length > 0) {
                inc_list.innerHTML = state.incidencias.map(i =>
                    '<div class="item" onclick="openModal(\'incidencia\',' + i.id + ')"><div class="item-title">' + i.titulo + '</div><div class="item-desc">' + i.desc + '</div></div>'
                ).join('');
                document.getElementById('incidencias-status').textContent = '✓ ' + state.incidencias.length + ' activas';
            } else {
                inc_list.innerHTML = '<div class="empty-state">Sin incidencias</div>';
            }

            // Borradores
            const bor_list = document.getElementById('borradores-list');
            bor_list.innerHTML = state.borradores.map(b =>
                '<div class="item" onclick="openModal(\'email\',' + b.id + ')"><div class="item-title">' + b.titulo + '</div><div class="item-desc">' + b.asunto + '</div></div>'
            ).join('');

            // Dudas
            const dud_list = document.getElementById('dudas-list');
            dud_list.innerHTML = state.dudas.map(d =>
                '<div class="item" onclick="openModal(\'duda\',' + d.id + ')"><div class="item-title">' + d.titulo + '</div><div class="item-desc">' + d.desc + '</div></div>'
            ).join('');

            // Completadas
            const comp_list = document.getElementById('completadas-list');
            if (state.completadas.length > 0) {
                comp_list.innerHTML = state.completadas.map(c =>
                    '<div class="item" onclick="openModal(\'completada\',' + c.id + ')"><div class="item-title">' + c.titulo + '</div><div class="item-desc">' + c.desc + '</div></div>'
                ).join('');
                document.getElementById('completadas-count').textContent = state.completadas.length + ' completadas';
            } else {
                document.getElementById('completadas-count').textContent = '0 completadas';
            }
        }

        function openModal(type, id) {
            let item = null;
            if (type === 'incidencia') item = state.incidencias.find(i => i.id === id);
            else if (type === 'email') item = state.borradores.find(b => b.id === id);
            else if (type === 'duda') item = state.dudas.find(d => d.id === id);
            else if (type === 'completada') item = state.completadas.find(c => c.id === id);

            if (!item) return;

            document.getElementById('modal-title').textContent = item.titulo;

            let body = '<div class="modal-field"><span class="modal-label">Descripción:</span><div class="modal-value">' + (item.desc || item.asunto || '---') + '</div></div>';
            if (type === 'incidencia') {
                body += '<div class="modal-field"><span class="modal-label">Estado:</span><div class="modal-value">' + item.estado + '</div></div>';
                body += '<div class="modal-field"><span class="modal-label">Proveedor:</span><div class="modal-value">' + item.proveedor + '</div></div>';
                body += '<div class="modal-field"><span class="modal-label">Oficio:</span><div class="modal-value">' + item.oficio + '</div></div>';
                body += '<div class="modal-field"><span class="modal-label">Fecha:</span><div class="modal-value">' + item.fecha + '</div></div>';
            }
            if (type === 'completada') {
                body += '<div class="modal-field"><span class="modal-label">Completada el:</span><div class="modal-value">' + item.fecha + '</div></div>';
            }

            document.getElementById('modal-body').innerHTML = body;

            let actions = '';
            if (type === 'incidencia') {
                actions = '<button class="action-btn action-btn-complete" onclick="complete(\'incidencia\',' + id + ')">✓ Marcar resuelta</button>';
            } else if (type === 'email') {
                actions = '<button class="action-btn action-btn-complete" onclick="complete(\'email\',' + id + ')">✓ Enviar</button>';
            } else if (type === 'duda') {
                actions = '<button class="action-btn action-btn-complete" onclick="complete(\'duda\',' + id + ')">✓ Resolver</button>';
            } else if (type === 'completada') {
                actions = '<button class="action-btn action-btn-cancel" onclick="removeComplete(' + id + ')">Eliminar</button>';
            }
            actions += '<button class="action-btn action-btn-cancel" onclick="closeModal()">Cerrar</button>';

            document.getElementById('modal-actions').innerHTML = actions;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function complete(type, id) {
            let item = null;
            if (type === 'incidencia') {
                item = state.incidencias.find(i => i.id === id);
                state.incidencias = state.incidencias.filter(i => i.id !== id);
            } else if (type === 'email') {
                item = state.borradores.find(b => b.id === id);
                state.borradores = state.borradores.filter(b => b.id !== id);
            } else if (type === 'duda') {
                item = state.dudas.find(d => d.id === id);
                state.dudas = state.dudas.filter(d => d.id !== id);
            }

            if (item) {
                state.completadas.push({
                    id: Date.now(),
                    titulo: item.titulo,
                    desc: item.desc || item.asunto || '---',
                    fecha: new Date().toLocaleString('es-ES')
                });
                localStorage.setItem('semaforo_completadas', JSON.stringify(state.completadas));
                updateUI();
                closeModal();
                alert('✓ "' + item.titulo + '" completada');
            }
        }

        function removeComplete(id) {
            state.completadas = state.completadas.filter(c => c.id !== id);
            localStorage.setItem('semaforo_completadas', JSON.stringify(state.completadas));
            updateUI();
            closeModal();
        }

        function syncData() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⟳ Sincronizando...';
            setTimeout(() => {
                loadData();
                btn.disabled = false;
                btn.textContent = '✓ Sincronizar';
            }, 1000);
        }

        document.getElementById('modal').addEventListener('click', e => {
            if (e.target === document.getElementById('modal')) closeModal();
        });

        window.addEventListener('load', loadData);
    </script>
</body>
</html>
