<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semáforo de Gestiones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Cabecera */
        .header {
            background: white;
            padding: 25px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 28px;
            color: #667eea;
            font-weight: 700;
        }

        .sync-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sync-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .sync-btn.syncing {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Tablero Kanban */
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .column {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .column-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }

        .column-icon {
            font-size: 20px;
        }

        .column-title {
            font-size: 16px;
            font-weight: 700;
            color: #2d3748;
        }

        .column-count {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: auto;
        }

        .cards-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .card:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
            border-color: #667eea;
        }

        .card.completada {
            background: #e6fffa;
            border-color: #81e6d9;
            opacity: 0.85;
        }

        .card-checkbox {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            padding-right: 30px;
            word-break: break-word;
        }

        .card-subtitle {
            font-size: 12px;
            color: #718096;
            margin-bottom: 10px;
        }

        .card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-comunidad {
            background: #e6f3ff;
            color: #0066cc;
        }

        .badge-proveedor {
            background: #f3e6ff;
            color: #6600cc;
        }

        .badge-estado {
            background: #fff3e0;
            color: #e65100;
        }

        .badge-estado.activo {
            background: #ffebee;
            color: #c62828;
        }

        .badge-estado.resuelto {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #a0aec0;
            font-size: 14px;
            text-align: center;
        }

        .footer {
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            text-align: center;
            color: white;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 14px;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .kanban-board {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .sync-btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* Scrollbar personalizado */
        .cards-container::-webkit-scrollbar {
            width: 6px;
        }

        .cards-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        .cards-container::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 10px;
        }

        .cards-container::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Cabecera -->
        <div class="header">
            <h1>Semáforo de Gestiones v4.0</h1>
            <button class="sync-btn" onclick="sincronizar()">
                <span>✓</span>
                <span>Sincronizar</span>
            </button>
        </div>

        <!-- Tablero Kanban -->
        <div class="loading" id="loading-state">Cargando datos de Firestore...</div>
        <div class="kanban-board" id="kanban-board" style="display: none;">
            <!-- Incidencias -->
            <div class="column">
                <div class="column-header">
                    <span class="column-icon">📋</span>
                    <span class="column-title">Incidencias</span>
                    <span class="column-count" id="count-incidencias">0</span>
                </div>
                <div class="cards-container" id="column-incidencias"></div>
            </div>

            <!-- Borradores -->
            <div class="column">
                <div class="column-header">
                    <span class="column-icon">📝</span>
                    <span class="column-title">Borradores</span>
                    <span class="column-count" id="count-borradores">0</span>
                </div>
                <div class="cards-container" id="column-borradores"></div>
            </div>

            <!-- Dudas -->
            <div class="column">
                <div class="column-header">
                    <span class="column-icon">❓</span>
                    <span class="column-title">Dudas</span>
                    <span class="column-count" id="count-dudas">0</span>
                </div>
                <div class="cards-container" id="column-dudas"></div>
            </div>

            <!-- Completadas -->
            <div class="column">
                <div class="column-header">
                    <span class="column-icon">✅</span>
                    <span class="column-title">Completadas</span>
                    <span class="column-count" id="count-completadas">0</span>
                </div>
                <div class="cards-container" id="column-completadas"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            Semáforo de Gestiones · v4.0 Kanban · Última actualización: <span id="last-update">--:--:--</span>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getFirestore, collection, query, where, getDocs, Timestamp, updateDoc, doc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCo5nFPGvK0gD0bfCAVlkCqEPRVxCamhPA",
            authDomain: "semaforo-fincas-5daea.firebaseapp.com",
            projectId: "semaforo-fincas-5daea",
            storageBucket: "semaforo-fincas-5daea.appspot.com",
            messagingSenderId: "105904431706730370252",
            appId: "1:105904431706730370252:web:7bfcf8b3d0b2c8e1f2g3h4i"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Función para formatear fecha
        function formatearFecha(timestamp) {
            if (!timestamp) return 'N/A';
            const fecha = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return fecha.toLocaleDateString('es-ES', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }

        // Función para obtener texto legible del estado
        function getStatusText(estado) {
            const textos = {
                'activo': 'Activo',
                'active': 'Activo',
                'pendiente': 'Pendiente',
                'pending': 'Pendiente',
                'resuelto': 'Resuelto',
                'resolved': 'Resuelto'
            };
            return textos[(estado || 'pending').toLowerCase()] || 'Pendiente';
        }

        function getStatusClass(estado) {
            const estado_lower = (estado || 'pending').toLowerCase();
            if (estado_lower === 'activo' || estado_lower === 'active') return 'activo';
            if (estado_lower === 'resuelto' || estado_lower === 'resolved') return 'resuelto';
            return '';
        }

        // Función para marcar como completada
        window.marcarCompletada = async function(docId, tipo) {
            try {
                const docRef = doc(db, tipo, docId);
                await updateDoc(docRef, { completada: true });
                console.log(`${tipo}/${docId} marcada como completada`);
                cargarTodasLasGestiones();
            } catch (error) {
                console.error('Error al marcar como completada:', error);
                alert('Error al guardar: ' + error.message);
            }
        };

        // Función para crear tarjeta
        function crearTarjeta(gestion, tipo) {
            const statusClass = getStatusClass(gestion.estado);
            const statusText = getStatusText(gestion.estado);
            const fechaVencimiento = formatearFecha(gestion.fechaVencimiento);

            return `
                <div class="card ${gestion.completada ? 'completada' : ''}">
                    <input type="checkbox" class="card-checkbox" 
                        ${gestion.completada ? 'checked' : ''} 
                        onchange="marcarCompletada('${gestion.id}', '${tipo}')">
                    <div class="card-title">${gestion.asunto || 'Sin asunto'}</div>
                    <div class="card-subtitle">${fechaVencimiento}</div>
                    <div class="card-badges">
                        <span class="badge badge-comunidad">${gestion.comunidad || 'N/A'}</span>
                        <span class="badge badge-proveedor">${gestion.proveedor || 'N/A'}</span>
                        <span class="badge badge-estado ${statusClass}">${statusText}</span>
                    </div>
                </div>
            `;
        }

        // Función para cargar gestiones por tipo
        async function cargarGestiones(tipo) {
            try {
                const hoy = new Date();
                hoy.setHours(0, 0, 0, 0);

                const mañana = new Date(hoy);
                mañana.setDate(mañana.getDate() + 1);

                // Todas las gestiones del tipo
                const q = query(
                    collection(db, tipo),
                    where('fechaVencimiento', '<', Timestamp.fromDate(mañana))
                );

                const snapshot = await getDocs(q);
                const gestiones = [];

                snapshot.forEach(doc => {
                    gestiones.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                // Separar completadas y pendientes
                const pendientes = gestiones.filter(g => !g.completada);
                const completadas = gestiones.filter(g => g.completada);

                return { pendientes, completadas };

            } catch (error) {
                console.error(`Error al cargar ${tipo}:`, error);
                return { pendientes: [], completadas: [] };
            }
        }

        // Función para renderizar columna
        function renderizarColumna(columnId, gestiones) {
            const column = document.getElementById(columnId);
            if (!column) return;

            if (gestiones.length === 0) {
                column.innerHTML = '<div class="empty-state">Sin gestiones</div>';
                return;
            }

            column.innerHTML = gestiones.map(g => crearTarjeta(g, g.tipo)).join('');
        }

        // Función para cargar todas las gestiones
        async function cargarTodasLasGestiones() {
            document.getElementById('loading-state').style.display = 'block';
            document.getElementById('kanban-board').style.display = 'none';

            const incidencias = await cargarGestiones('incidencias');
            const borradores = await cargarGestiones('borradores');
            const dudas = await cargarGestiones('dudas');

            // Renderizar columnas pendientes
            renderizarColumna('column-incidencias', incidencias.pendientes);
            renderizarColumna('column-borradores', borradores.pendientes);
            renderizarColumna('column-dudas', dudas.pendientes);

            // Columna de completadas (todas)
            const todasCompletadas = [
                ...incidencias.completadas.map(g => ({ ...g, tipo: 'incidencias' })),
                ...borradores.completadas.map(g => ({ ...g, tipo: 'borradores' })),
                ...dudas.completadas.map(g => ({ ...g, tipo: 'dudas' }))
            ];
            renderizarColumna('column-completadas', todasCompletadas);

            // Actualizar contadores
            document.getElementById('count-incidencias').textContent = incidencias.pendientes.length;
            document.getElementById('count-borradores').textContent = borradores.pendientes.length;
            document.getElementById('count-dudas').textContent = dudas.pendientes.length;
            document.getElementById('count-completadas').textContent = todasCompletadas.length;

            // Actualizar hora
            const ahora = new Date();
            document.getElementById('last-update').textContent = ahora.toLocaleTimeString('es-ES');

            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('kanban-board').style.display = 'grid';
        }

        // Función sincronizar
        window.sincronizar = async function() {
            const btn = document.querySelector('.sync-btn');
            btn.classList.add('syncing');
            btn.disabled = true;
            await cargarTodasLasGestiones();
            btn.classList.remove('syncing');
            btn.disabled = false;
        };

        // Cargar gestiones al iniciar
        cargarTodasLasGestiones();

        // Recargar cada 30 segundos
        setInterval(cargarTodasLasGestiones, 30000);
    </script>
</body>
</html>
